version: "3.8"

services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    secrets:
      - credentials
      - db_password
      - db_root_password
    expose:
      - "3306"

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis   # still depends on it if you're using Redis cache
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    secrets:
      - credentials
      - db_password
      - db_root_password
    expose:
      - "9000"

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    secrets:
      - credentials
      - db_password
      - db_root_password

  # =========================
  # Bonus services
  # =========================

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: unless-stopped
    networks:
      - inception
    expose:
      - "6379"

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - "21:21"
      - "21100:21100"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    secrets:
      - credentials
      - db_password
      - db_root_password
      
  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - inception
    secrets:
      - credentials
      - db_password
      - db_root_password
    ports:
      - "8083:8080"

  static-website:
    build:
      context: ./requirements/bonus/static-website
      dockerfile: Dockerfile
    container_name: static-website
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - inception

  filebrowser:
    build:
      context: ./requirements/bonus/filebrowser
      dockerfile: Dockerfile
    container_name: filebrowser
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8080"
    volumes:
      - filebrowser_data:/data
      - wordpress_data:/srv
    networks:
      - inception
    secrets:
      - credentials
      - db_password
      - db_root_password

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
    
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aayache/data/mariadb

  filebrowser_data:
    driver: local
  
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aayache/data/wordpress
 
networks:
  inception:
    driver: bridge
