# Run in foreground for Docker
background=NO

# Basic FTP settings
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Chroot jail for security
chroot_local_user=YES
allow_writeable_chroot=YES

# Set WordPress directory as FTP root
local_root=/var/www/html

# Passive mode settings (required for Docker)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=0.0.0.0

# Logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd/vsftpd.log
log_ftp_protocol=YES

# Security - Enable TLS/SSL (FTPS)
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH

# SSL certificate paths
rsa_cert_file=/etc/ssl/certs/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# Performance
use_localtime=YES
check_shell=NO

# User list (optional - can restrict users)
userlist_enable=NO
