# Run in standalone mode
listen=YES
listen_ipv6=NO

# Run in foreground for Docker
background=NO

# Basic FTP settings
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Disable chroot (causes "child died" errors)
chroot_local_user=NO

# Set WordPress directory as FTP root
local_root=/var/www/html

# Passive mode for Docker
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=0.0.0.0
pasv_addr_resolve=NO

# Logging
xferlog_enable=YES
log_ftp_protocol=YES

# NO SSL
ssl_enable=NO

# Security
seccomp_sandbox=NO
allow_writeable_chroot=YES

# Allow local users
pam_service_name=ftp