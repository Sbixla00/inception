# Bind to all interfaces so WordPress container can connect
bind 0.0.0.0

# Port
port 6379

# Run as daemon? No (we want foreground for Docker)
daemonize no

# Persistence - save to disk periodically
save 900 1
save 300 10
save 60 10000

# Directory for dump files
dir /var/lib/redis

# Log to stdout for Docker
logfile ""

# Max memory (adjust as needed)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable protected mode (we're on isolated Docker network)
protected-mode no
